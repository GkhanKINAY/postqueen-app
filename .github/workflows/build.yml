---
name: Build

on:
  push:
  merge_group:
  pull_request:

# `on: push` has no branch filter, and this job now runs two cold `tsc` passes
# before the build. Without this, pushing three times to a branch keeps three
# full runs alive; only the newest can still be interesting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    

    strategy:
      matrix:
        node-version: ['22.12.0']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

#      - name: Setup pnpm cache
#        uses: actions/cache@v4
#        with:
#          path: |
#            ${{ env.STORE_PATH }}
#            ${{ github.workspace }}/.next/cache
#          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
#          restore-keys: |
#            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install

      # The redesign's behaviour guard: types, the set of API endpoints called,
      # the i18n key set, the route list, the feature gates, and whether every
      # indefinite animation can still be switched off for prefers-reduced-motion.
      # It compares against docs/ui-migration-baseline/ and fails on any drift.
      # Before this it ran only when someone remembered to, which is to say
      # never — see the header of the script.
      - name: UI migration guard
        run: scripts/ui-migration-check.sh

      - name: Build
        run: pnpm run build
