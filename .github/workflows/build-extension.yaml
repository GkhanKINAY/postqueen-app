name: Build Extension

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Zip extensions
        run: FRONTEND_URL=https://app.postqueen.ai NEXT_PUBLIC_BACKEND_URL=https://app.postqueen.ai/api pnpm run build:extension

      # The artifact downloads as a zip of dist, which is the file the Chrome
      # Web Store dashboard takes.
      - name: Upload the extension
        uses: actions/upload-artifact@v4
        with:
          name: postqueen-extension
          path: apps/extension/dist
          if-no-files-found: error
