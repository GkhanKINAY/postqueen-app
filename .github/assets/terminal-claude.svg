<svg xmlns="http://www.w3.org/2000/svg" width="620" height="418" viewBox="0 0 620 418" role="img" aria-label="Claude Code in a terminal: you ask in plain words, it schedules posts with the postqueen CLI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0e1d"/><stop offset="1" stop-color="#171331"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="618" height="416" rx="22" fill="url(#bg)" stroke="#2a2150" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="1" y="1" width="618" height="52" rx="22" fill="#1b1633"/>
  <rect x="1" y="32" width="618" height="21" fill="#1b1633"/>
  <circle cx="30" cy="27" r="6.5" fill="#ff5f57"/>
  <circle cx="52" cy="27" r="6.5" fill="#febc2e"/>
  <circle cx="74" cy="27" r="6.5" fill="#28c840"/>
  <image x="264.0" y="18.0" width="18" height="18" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
  <text x="290" y="33" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#cec7f5">Claude Code</text>
  <!-- session -->
  <text x="28" y="88" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ffffff"><tspan fill="#a78bfa">you &gt;</tspan> schedule our launch post for tomorrow 9am</text>
  <text x="72" y="112" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ffffff">on X and LinkedIn</text>
  <rect x="20" y="134" width="580" height="132" rx="10" fill="#141127"/>
  <text x="34" y="158" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#6f6899"># Claude runs the PostQueen skill</text>
  <text x="34" y="184" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#ffffff"><tspan fill="#4ade80">$</tspan> postqueen posts:create \</text>
  <text x="66" y="208" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#c4b5fd">-c <tspan fill="#93c5fd">"Launching our new feature today!"</tspan> \</text>
  <text x="66" y="232" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#c4b5fd">-s <tspan fill="#93c5fd">"2026-08-01T09:00:00Z"</tspan> \</text>
  <text x="66" y="256" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#c4b5fd">-i <tspan fill="#93c5fd">"x-id,linkedin-id"</tspan></text>
  <!-- success -->
  <circle cx="35" cy="294" r="7.5" fill="#16a34a"/>
  <path d="M31.5,294 L34.2,296.8 L38.8,291.4" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="299" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#4ade80">2 posts scheduled</text>
  <text x="52" y="326" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#8b84b5">X         tomorrow, 9:00 AM</text>
  <text x="52" y="348" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#8b84b5">LinkedIn  tomorrow, 9:00 AM</text>
  <text x="28" y="388" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#ffffff"><tspan fill="#a78bfa">claude &gt;</tspan> Done! They are on your calendar for review.</text>
</svg>
